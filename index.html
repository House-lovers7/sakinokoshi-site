<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>先のこし - サポート</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #fdf6f0 0%, #fff5ee 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #c17f6e;
        }
        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }
        .description {
            line-height: 1.8;
            margin-bottom: 30px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .links a {
            display: block;
            padding: 15px 20px;
            background: #f8f4f2;
            border-radius: 12px;
            text-decoration: none;
            color: #333;
            transition: background 0.2s;
        }
        .links a:hover {
            background: #f0e8e4;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            color: #aaa;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>先のこし</h1>
        <p class="subtitle">買う前に、未来の価値を見る</p>

        <p class="description">
            「先のこし」は、日々の小さな出費を"未来から見直す"ための節約サポートアプリです。
            金額を入力するだけで、5年後・10年後・20年後・30年後の価値をすぐに確認できます。
        </p>

        <div class="links">
            <a href="./privacy/">プライバシーポリシー</a>
            <a href="./terms/">ご利用にあたって</a>
            <a href="mailto:support@example.com">お問い合わせ</a>
        </div>

        <p class="footer">© 2026 Taisuke Goto</p>
    </div>
</body>
</html>
